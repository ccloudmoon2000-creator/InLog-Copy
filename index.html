<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0d0f14">
<title>InLog</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
/* ==========================================================
   InLog — folha de estilos única
   1. Tokens  2. Base  3. Header  4. Layout  5. Componentes
   6. Autenticação  7. Perfil  8. Responsivo
   ========================================================== */

/* 1. TOKENS — altera aqui as cores e o "feeling" da app */
:root {
  --bg: #0d0f14;          /* fundo da página */
  --surface: #151822;     /* cartões */
  --surface-2: #1d2130;   /* campos, hover */
  --line: #262b3b;        /* bordas */
  --text: #eceef5;
  --muted: #8a92a8;
  --accent: #8b7bff;      /* cor de destaque (violeta-íris) */
  --accent-2: #5ee0c1;    /* destaque secundário (menta) */
  --danger: #ff6b81;
  --r-sm: 10px; --r-md: 14px; --r-lg: 20px;
  --ease: cubic-bezier(.2, .7, .2, 1);
  --font: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
}

/* 2. BASE */
*, *::before, *::after { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { margin: 0; background: var(--bg); color: var(--text); font: 400 15px/1.55 var(--font); -webkit-font-smoothing: antialiased; }
a { color: inherit; text-decoration: none; }
button, input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { margin: 0; letter-spacing: -.02em; }
.muted { color: var(--muted); }

/* Botões */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 9px 18px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface-2); cursor: pointer; font-weight: 600; transition: transform .2s var(--ease), background .2s, border-color .2s; }
.btn:hover { border-color: var(--accent); transform: translateY(-1px); }
.btn:active { transform: translateY(0) scale(.98); }
.btn-primary { background: var(--accent); border-color: var(--accent); color: #12102a; }
.btn-primary:hover { background: #9d8fff; }
.btn-block { width: 100%; padding: 12px; }

/* Avatar: iniciais sobre gradiente (trocar por <img> quando houver fotos) */
.avatar { width: 44px; height: 44px; flex: none; border-radius: 50%; display: grid; place-items: center; font-weight: 800; color: #12102a; background: linear-gradient(135deg, var(--accent), var(--accent-2)); }
.avatar.lg { width: 96px; height: 96px; font-size: 32px; border: 4px solid var(--bg); }

/* 3. HEADER */
.header { position: sticky; top: 0; z-index: 20; background: rgba(13, 15, 20, .85); backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); }
.header-in { max-width: 1080px; margin: 0 auto; padding: 12px 16px; display: flex; align-items: center; gap: 20px; }
.logo { display: flex; align-items: center; gap: 10px; font-size: 22px; font-weight: 800; letter-spacing: -.04em; }
.logo svg { width: 28px; height: 28px; }
.nav { display: flex; align-items: center; gap: 6px; margin-left: auto; }
.nav a:not(.btn) { padding: 8px 14px; border-radius: 999px; color: var(--muted); transition: color .2s, background .2s; }
.nav a:not(.btn):hover, .nav a.active { color: var(--text); background: var(--surface-2); }
.burger { display: none; margin-left: auto; background: none; border: 0; padding: 8px; cursor: pointer; }
.burger span { display: block; width: 22px; height: 2px; margin: 5px 0; background: var(--text); border-radius: 2px; transition: transform .25s var(--ease), opacity .2s; }
.burger[aria-expanded="true"] span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
.burger[aria-expanded="true"] span:nth-child(2) { opacity: 0; }
.burger[aria-expanded="true"] span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }

/* 4. LAYOUT (3 colunas no desktop, 1 no telemóvel) */
.layout { max-width: 1080px; margin: 0 auto; padding: 20px 16px 90px; display: grid; grid-template-columns: 250px minmax(0, 1fr) 250px; gap: 20px; align-items: start; }
.side { position: sticky; top: 76px; display: grid; gap: 16px; }
.feed { display: grid; gap: 14px; }

/* 5. COMPONENTES */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 16px; }
.user-card { text-align: center; }
.user-card .avatar { margin: 0 auto 10px; width: 64px; height: 64px; font-size: 22px; }
.stats { display: flex; justify-content: space-around; margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--line); }
.stats b { display: block; font-size: 18px; }
.stats span { font-size: 12px; color: var(--muted); }

.composer { display: flex; align-items: center; gap: 12px; width: 100%; cursor: pointer; text-align: left; color: var(--muted); transition: border-color .2s; }
.composer:hover { border-color: var(--accent); }

/* Publicação */
.post { display: flex; gap: 12px; position: relative; animation: enter .35s var(--ease) both; }
.post-body { min-width: 0; flex: 1; }
.post-head { display: flex; gap: 6px; align-items: baseline; flex-wrap: wrap; }
.post-head b { font-weight: 700; }
.post-text { margin: 4px 0 12px; white-space: pre-wrap; overflow-wrap: anywhere; }
.actions { display: flex; gap: 6px; margin-left: -8px; }
.act { background: none; border: 0; padding: 6px 10px; border-radius: 999px; color: var(--muted); cursor: pointer; transition: color .2s, background .2s, transform .2s var(--ease); }
.act:hover { background: var(--surface-2); color: var(--text); }
.act.liked { color: var(--danger); }
.act.liked .heart { animation: pop .3s var(--ease); display: inline-block; }
@keyframes enter { from { opacity: 0; transform: translateY(8px); } }
@keyframes pop { 50% { transform: scale(1.4); } }

.list-item { display: flex; align-items: center; gap: 10px; padding: 8px 0; }
.list-item .avatar { width: 36px; height: 36px; font-size: 13px; }
.list-item .btn { margin-left: auto; padding: 5px 12px; font-size: 13px; }
.card h3 { font-size: 15px; margin-bottom: 6px; }

/* Botão flutuante (só telemóvel) */
.fab { display: none; position: fixed; right: 18px; bottom: 18px; width: 56px; height: 56px; border-radius: 50%; border: 0; background: var(--accent); color: #12102a; font-size: 28px; cursor: pointer; box-shadow: 0 8px 24px rgba(139, 123, 255, .4); transition: transform .2s var(--ease); }
.fab:active { transform: scale(.92); }

/* Diálogo (criar publicação / editar perfil) */
dialog { width: min(520px, calc(100% - 32px)); background: var(--surface); color: var(--text); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 20px; }
dialog::backdrop { background: rgba(5, 6, 10, .7); backdrop-filter: blur(3px); }
dialog[open] { animation: enter .25s var(--ease); }
dialog h2 { font-size: 18px; margin-bottom: 14px; }
.dialog-actions { display: flex; justify-content: flex-end; align-items: center; gap: 10px; margin-top: 14px; }
.counter { margin-right: auto; font-size: 13px; color: var(--muted); }

/* Formulários */
.field { display: grid; gap: 6px; margin-bottom: 14px; }
.field label { font-size: 13px; color: var(--muted); font-weight: 600; }
.input { width: 100%; padding: 12px 14px; background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--r-md); transition: border-color .2s, box-shadow .2s; }
.input:focus { outline: 0; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(139, 123, 255, .2); }
textarea.input { resize: vertical; min-height: 110px; }
.error { color: var(--danger); font-size: 13px; min-height: 18px; margin: 0 0 8px; }

/* Aviso temporário */
.toast { position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 20px); background: var(--text); color: var(--bg); padding: 10px 18px; border-radius: 16px; width: max-content; max-width: 90vw; text-align: center; font-weight: 600; opacity: 0; pointer-events: none; transition: .3s var(--ease); z-index: 50; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }

/* 6. AUTENTICAÇÃO */
.auth { min-height: 100vh; display: grid; place-items: center; padding: 20px; background: radial-gradient(600px 300px at 50% 0, rgba(139, 123, 255, .16), transparent); }
.auth-card { width: min(400px, 100%); padding: 28px; animation: enter .4s var(--ease) both; }
.auth-card .logo { justify-content: center; margin-bottom: 6px; }
.auth-card h1 { font-size: 20px; text-align: center; }
.auth-card .sub { text-align: center; margin: 4px 0 22px; }
.auth-foot { text-align: center; margin: 18px 0 0; color: var(--muted); }
.auth-foot a { color: var(--accent); font-weight: 700; }

/* 7. PERFIL */
.profile { max-width: 680px; margin: 0 auto; padding: 0 16px 90px; }
.cover { height: 150px; margin-top: 16px; border-radius: var(--r-lg); background: linear-gradient(120deg, #26215a, #14303a); }
.profile-head { display: flex; align-items: flex-end; justify-content: space-between; margin: -48px 16px 0; }
.profile-info { padding: 12px 16px 0; }
.profile-info h1 { font-size: 24px; }
.profile-stats { display: flex; gap: 22px; margin: 14px 0 22px; }
.profile-stats b { font-size: 17px; }

/* 8. RESPONSIVO */
@media (max-width: 960px) { .layout { grid-template-columns: 230px minmax(0, 1fr); } .side-right { display: none; } }
@media (max-width: 720px) {
  .layout { grid-template-columns: 1fr; padding-top: 14px; }
  .side-left { position: static; }
  .burger { display: block; }
  .nav { display: none; position: absolute; top: 100%; left: 0; right: 0; flex-direction: column; align-items: stretch; padding: 12px 16px 16px; background: var(--surface); border-bottom: 1px solid var(--line); margin: 0; }
  .nav.open { display: flex; animation: enter .25s var(--ease); }
  .nav .btn { margin-top: 6px; }
  .fab { display: block; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

/* Extras da versão com Supabase */
.avatar { overflow: hidden; }
.avatar img { width: 100%; height: 100%; object-fit: cover; }
.hidden { display: none !important; }
.empty { text-align: center; color: var(--muted); padding: 28px 16px; }
.banner { background: var(--surface-2); border: 1px dashed var(--accent); border-radius: var(--r-md); padding: 8px 14px; font-size: 13px; color: var(--muted); text-align: center; }
body.auth-mode #app { min-height: 100vh; display: grid; place-items: center; padding: 20px; background: radial-gradient(600px 300px at 50% 0, rgba(139,123,255,.16), transparent); }
.profile-info p { margin: 8px 0 0; }
.post-text:empty { display: none; }
.post-img { display: block; width: 100%; max-height: 460px; object-fit: cover; border: 1px solid var(--line); border-radius: var(--r-md); margin: 4px 0 12px; background: var(--surface-2); }
.act.del { margin-left: auto; }
.act.del:hover { color: var(--danger); }
.add-img { margin-top: 12px; font-size: 14px; }
#img-preview { position: relative; margin-top: 12px; }
#img-preview img { width: 100%; max-height: 240px; object-fit: cover; border-radius: var(--r-md); }
#img-preview .btn { position: absolute; top: 8px; right: 8px; padding: 5px 12px; font-size: 13px; background: rgba(13,15,20,.85); }
.post.removing { opacity: 0; transform: scale(.98); transition: .25s var(--ease); }
.page { max-width: 680px; margin: 0 auto; padding: 20px 16px 90px; display: grid; gap: 14px; align-content: start; }
.ptitle { font-size: 22px; } .ptitle-row { display: flex; justify-content: space-between; align-items: center; }
.tabs { display: flex; gap: 6px; }
.list-item .grow { flex: 1; min-width: 0; } .list-item .grow > * { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.list-item.link .grow { cursor: pointer; }
.row-actions { margin-left: auto; display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.row-actions .btn { margin-left: 0; padding: 6px 14px; font-size: 13px; }
.profile-stats { flex-wrap: wrap; }
.checks { display: grid; gap: 4px; max-height: 220px; overflow-y: auto; }
.check { display: flex; align-items: center; gap: 10px; padding: 6px 4px; cursor: pointer; }
.chat { max-width: 680px; margin: 0 auto; height: calc(100dvh - 62px); display: flex; flex-direction: column; padding: 0 16px; }
.chat-head { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.chat-head .btn { padding: 6px 14px; } .chat-head b { flex: 1; font-size: 17px; }
.msgs { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; padding: 14px 0; }
.msg { max-width: 80%; padding: 8px 13px; border-radius: 16px; background: var(--surface-2); align-self: flex-start; overflow-wrap: anywhere; animation: enter .2s var(--ease) both; }
.msg.me { align-self: flex-end; background: var(--accent); color: #12102a; }
.msg small { display: block; font-size: 11px; color: var(--muted); }
.chat-form { display: flex; gap: 8px; padding: 12px 0 14px; }
.chat-host { flex: 1; display: flex; flex-direction: column; min-height: 0; }
.msgs { min-height: 0; }
.chan-host { display: flex; flex-direction: column; height: min(60dvh, 560px); padding: 0 16px; }
.lnk { color: var(--accent); text-decoration: underline; } .msg.me .lnk { color: #12102a; }
.btn-danger { border-color: var(--danger); color: var(--danger); } .btn-danger:hover { background: var(--danger); color: #12102a; border-color: var(--danger); }
.callbar { position: fixed; left: 12px; right: 12px; bottom: 12px; max-width: 520px; margin: 0 auto; z-index: 60; display: flex; align-items: center; gap: 8px; padding: 12px 16px; background: var(--surface); border: 1px solid var(--accent); border-radius: var(--r-lg); box-shadow: 0 10px 30px rgba(0,0,0,.5); animation: enter .25s var(--ease); }
.callbar span { flex: 1; font-weight: 600; } .callbar .btn { padding: 7px 14px; }
.comm-head { display: flex; gap: 14px; align-items: center; } .comm-head h2 { font-size: 20px; } .comm-head p { margin: 2px 0 0; }
.avatar.md { width: 56px; height: 56px; font-size: 18px; }
.chans { flex-wrap: wrap; }
.role { border: 1px solid var(--line); border-radius: var(--r-md); padding: 12px; margin: 10px 0; display: grid; gap: 10px; }
.role-top, .add-row { display: flex; gap: 8px; } .add-row { margin-top: 10px; }
input[type=color] { width: 46px; height: 46px; flex: none; padding: 3px; background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--r-sm); }
.sel { width: auto; padding: 6px 10px; }
.cfg h3 { margin-bottom: 10px; }
</style>
</head>
<body>
<div id="app"></div>

<!-- Diálogo: nova publicação -->
<dialog id="composer-dialog"><form method="dialog">
  <h2>Nova publicação</h2>
  <textarea class="input" maxlength="280" placeholder="O que estás a pensar?"></textarea>
  <div id="img-preview" class="hidden"><img alt="Pré-visualização"><button type="button" class="btn" id="img-remove">Remover</button></div>
  <label class="btn add-img" for="p-image">📷 Adicionar imagem</label><input type="file" id="p-image" accept="image/*" class="hidden">
  <div class="dialog-actions">
    <span class="counter">0/280</span>
    <button class="btn" value="cancel" formnovalidate>Cancelar</button>
    <button class="btn btn-primary" value="ok">Publicar</button>
  </div>
</form></dialog>

<!-- Diálogo: editar perfil -->
<dialog id="edit-dialog"><form method="dialog">
  <h2>Editar perfil</h2>
  <div class="field" id="avatar-field"><label for="e-avatar">Foto de perfil</label><input class="input" id="e-avatar" type="file" accept="image/*"></div>
  <div class="field"><label for="e-name">Nome de apresentação</label><input class="input" id="e-name" maxlength="40"></div>
  <div class="field"><label for="e-bio">Biografia</label><textarea class="input" id="e-bio" maxlength="160"></textarea></div>
  <div class="dialog-actions"><button class="btn" value="cancel" formnovalidate>Cancelar</button><button class="btn btn-primary" value="ok">Guardar</button></div>
</form></dialog>

<!-- Diálogo: novo grupo -->
<dialog id="group-dialog"><form method="dialog">
  <h2>Novo grupo</h2>
  <div class="field"><label for="g-name">Nome do grupo</label><input class="input" id="g-name" maxlength="40"></div>
  <div class="field"><label>Membros (os teus amigos)</label><div id="g-members" class="checks"></div></div>
  <div class="dialog-actions"><button class="btn" value="cancel" formnovalidate>Cancelar</button><button class="btn btn-primary" value="ok">Criar</button></div>
</form></dialog>

<!-- Diálogo: nova comunidade -->
<dialog id="comm-dialog"><form method="dialog">
  <h2>Nova comunidade</h2>
  <div class="field"><label for="cm-name">Nome</label><input class="input" id="cm-name" maxlength="40"></div>
  <div class="field"><label for="cm-desc">Descrição</label><textarea class="input" id="cm-desc" maxlength="200" style="min-height:80px"></textarea></div>
  <label class="check"><input type="checkbox" id="cm-private"><span>Privada (só entra quem tiver convite)</span></label>
  <div class="dialog-actions"><button class="btn" value="cancel" formnovalidate>Cancelar</button><button class="btn btn-primary" value="ok">Criar</button></div>
</form></dialog>

<!-- Diálogo: convidar para a comunidade -->
<dialog id="invite-dialog"><form method="dialog">
  <h2>Convidar para a comunidade</h2>
  <div class="field"><label>Link de convite</label><div style="display:flex;gap:8px"><input class="input" id="inv-link" readonly><button type="button" class="btn btn-primary" id="inv-copy">Copiar</button></div></div>
  <h3 style="margin-bottom:6px">Convidar amigos</h3><div id="inv-friends"></div>
  <div class="dialog-actions"><button class="btn" value="cancel" formnovalidate>Fechar</button></div>
</form></dialog>

<!-- Diálogo: apagar conta -->
<dialog id="delete-dialog"><form method="dialog">
  <h2>Apagar conta</h2>
  <p class="muted">Isto apaga para sempre o teu perfil, publicações, mensagens e as comunidades que criaste. Não dá para desfazer.</p>
  <div class="field"><label for="d-confirm">Escreve o teu nome de utilizador para confirmar</label><input class="input" id="d-confirm" autocomplete="off"></div>
  <div class="dialog-actions"><button class="btn" value="cancel" formnovalidate>Cancelar</button><button class="btn btn-danger" value="ok">Apagar para sempre</button></div>
</form></dialog>

<!-- Chamadas de voz: barra durante a chamada, aviso de chamada recebida e áudio remoto -->
<div class="callbar hidden" id="call-ui"><span id="call-text"></span><button class="btn" id="call-mute" aria-label="Silenciar">🎤</button><button class="btn btn-danger" id="call-end">Desligar</button></div>
<div class="callbar hidden" id="incoming"><span id="inc-text"></span><button class="btn btn-primary" id="inc-yes">Atender</button><button class="btn" id="inc-no">Recusar</button></div>
<audio id="remote-audio" autoplay></audio>

<div class="toast" id="toast"></div>

<script>
/* Se algo falhar ao carregar, mostra o erro no ecrã em vez de ficar tudo preto */
function showFatal(msg) {
  const app = document.getElementById("app");
  if (app && !app.innerHTML.trim()) {
    app.innerHTML = '<main class="card auth-card"><h1>Erro ao carregar</h1><p class="sub muted" id="fatal"></p></main>';
    document.body.classList.add("auth-mode");
    document.getElementById("fatal").textContent = msg || "Erro desconhecido";
  }
}
window.addEventListener("error", (e) => showFatal(e.message));
window.addEventListener("unhandledrejection", (e) => showFatal(e.reason && e.reason.message));

/* ==========================================================
   InLog — ficheiro único (HTML + CSS + JS)
   1. Configuração   2. Utilitários   3. Camada de dados (api)
   4. Componentes    5. Vistas        6. Router e arranque
   ========================================================== */

/* ---------- 1. CONFIGURAÇÃO ----------
   Preenche as duas linhas abaixo com o URL e a chave "anon/public" do teu projeto Supabase
   (Project Settings → API Keys). A chave publishable (sb_publishable_...) é feita para ser pública;
   a segurança vem das regras RLS do ficheiro supabase.sql.
   Enquanto estiverem vazias, a app mostra um ecrã de configuração. */
const SUPABASE_URL = "https://qqsyjrjrqkmfynmaudfo.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_aCtA-XL_1p2DLPW05-fz7A_YK_gx7-m";
const CONFIGURED = Boolean(SUPABASE_URL && SUPABASE_ANON_KEY);

/* Chamadas de voz — servidor TURN próprio (Coturn).
   Depois de instalar o Coturn na tua VPS (script coturn-setup.sh), preenche as 3 linhas abaixo. */
const COTURN = { host: "", user: "", pass: "" };   // ex.: host "203.0.113.10" (IP ou domínio da VPS)
const TURN_SERVERS = COTURN.host ? [{ urls: [`turn:${COTURN.host}:3478?transport=udp`, `turn:${COTURN.host}:3478?transport=tcp`], username: COTURN.user, credential: COTURN.pass }] : [];
const sb = CONFIGURED ? supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

/* ---------- 2. UTILITÁRIOS ---------- */
const $ = (s, r = document) => r.querySelector(s);
const initials = (n = "?") => n.split(/[\s._]+/).map((p) => p[0]).slice(0, 2).join("").toUpperCase();
const html = (s) => { const t = document.createElement("template"); t.innerHTML = s.trim(); return t.content.firstElementChild; };

let toastTimer;
function toast(msg) {
  const el = $("#toast"); el.textContent = msg; el.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove("show"), 2600);
}

/* "há 5 min", "há 2 h"... */
function timeAgo(iso) {
  const s = Math.max(0, (Date.now() - new Date(iso)) / 1000);
  if (s < 60) return "agora";
  if (s < 3600) return `há ${Math.floor(s / 60)} min`;
  if (s < 86400) return `há ${Math.floor(s / 3600)} h`;
  return new Date(iso).toLocaleDateString("pt-PT", { day: "numeric", month: "short" });
}

/* Reduz a imagem (máx. 1600 px, JPEG) para poupar espaço e acelerar o envio */
function resizeImage(file, max = 1600) {
  return new Promise((resolve, reject) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement("canvas"); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      c.toBlob((b) => (b ? resolve(b) : reject(new Error("Imagem inválida."))), "image/jpeg", 0.85);
    };
    img.onerror = () => reject(new Error("Não foi possível ler a imagem."));
    img.src = url;
  });
}

/* Executa uma ação e mostra o erro num aviso em vez de partir a app */
async function safe(fn) { try { return await fn(); } catch (e) { toast(/row-level security/i.test(e.message || "") ? "Não tens permissão para fazer isto." : e.message || "Algo correu mal."); } }

/* Avatar: foto (Storage) ou iniciais */
function avatar(name, url, cls = "") {
  const d = html(`<div class="avatar ${cls}"></div>`);
  if (url) { const i = new Image(); i.src = url; i.alt = ""; d.appendChild(i); } else d.textContent = initials(name);
  return d;

/* Publicação. Texto de utilizadores entra sempre com textContent (anti-XSS) */
function postEl(p, myId) {
  const el = html(`<article class="card post"><div class="post-body">
    <div class="post-head"><b></b><span class="muted"></span></div><p class="post-text"></p><img class="post-img hidden" alt="" loading="lazy">
    <div class="actions"><button class="act like"><span class="heart">♥</span> <span class="n"></span></button><button class="act del hidden" aria-label="Apagar publicação">🗑 Apagar</button></div></div></article>`);
  el.prepend(avatar(p.name, p.avatar));
  $("b", el).textContent = p.name; $("b", el).style.cursor = "pointer"; $("b", el).onclick = () => (location.hash = "#/u/" + p.username);
  $(".muted", el).textContent = `@${p.username} · ${timeAgo(p.time)}`;
  $(".post-text", el).textContent = p.text;
  if (p.image) { const im = $(".post-img", el); im.src = p.image; im.classList.remove("hidden"); }
  // Só o autor vê o botão Apagar (a base de dados também o garante, via RLS)
  if (p.userId === myId) {
    const del = $(".del", el); del.classList.remove("hidden");
    del.addEventListener("click", async () => {
      if (!confirm("Apagar esta publicação? Não dá para desfazer.")) return;
      const ok = await safe(async () => { await api.deletePost(p); return true; });
      if (!ok) return;
      el.classList.add("removing"); toast("Publicação apagada");
      setTimeout(() => afterPublish(), 250);
    });
  }
  const btn = $(".like", el), paint = () => { btn.classList.toggle("liked", p.liked); $(".n", btn).textContent = p.likes; };
  paint();
  btn.addEventListener("click", async () => {
    const ok = await safe(async () => { await api.toggleLike(p, myId); return true; });
    if (!ok) return;
    p.liked = !p.liked; p.likes += p.liked ? 1 : -1; paint();   // atualização visual imediata
  });
  return el;
}

/* Diálogo de publicar: a vista atual define o que fazer depois de publicar */
let afterPublish = () => {};
let composerCommunity = null;   // preenchido quando se publica dentro de uma comunidade
(function wireComposer() {
  const dlg = $("#composer-dialog"), ta = $("textarea", dlg), fileIn = $("#p-image"), prev = $("#img-preview");
  let file = null;
  const clearImg = () => { file = null; fileIn.value = ""; prev.classList.add("hidden"); };
  ta.addEventListener("input", () => ($(".counter", dlg).textContent = `${ta.value.length}/280`));
  fileIn.addEventListener("change", () => {
    const f = fileIn.files[0]; if (!f) return;
    if (!f.type.startsWith("image/")) return toast("Escolhe um ficheiro de imagem.");
    file = f; $("img", prev).src = URL.createObjectURL(f); prev.classList.remove("hidden");
  });
  $("#img-remove").onclick = clearImg;
  document.addEventListener("click", (e) => {
    if (e.target.closest("[data-open-composer]")) { e.preventDefault(); $(".nav")?.classList.remove("open"); dlg.showModal(); ta.focus(); }
  });
  $("form", dlg).addEventListener("submit", async (e) => {
    if (e.submitter?.value !== "ok") return;
    const text = ta.value.trim();
    if (!text && !file) { e.preventDefault(); return toast("Escreve algo ou adiciona uma imagem."); }
    toast("A publicar…");
    const ok = await safe(async () => { await api.createPost(text, file, composerCommunity); return true; });
    if (ok) { ta.value = ""; $(".counter", dlg).textContent = "0/280"; clearImg(); toast("Publicado"); afterPublish(); }
  });
})();

  for (const s of people) {
    const row = html(`<div class="list-item"><div><b></b><div class="muted"></div></div><button class="btn">Seguir</button></div>`);
    row.prepend(avatar(s.display_name || s.username, s.avatar_url));

    $("b", row).style.cursor = "pointer"; $("b", row).onclick = () => (location.hash = "#/u/" + s.username);

      const ok = await safe(async () => { await api.follow(s.id); return true; });
      if (ok) { e.target.textContent = "A seguir ✓"; e.target.disabled = true; }
    };
    $("#suggestions").append(row);
  }
}

function viewRegisto() {
  const form = authView("Cria a tua conta", "Leva menos de um minuto.",
    field("username", "Nome de utilizador", "text", "username") + field("email", "Email", "email", "email") +
    field("password", "Palavra-passe", "password", "new-password") + field("confirm", "Confirmar palavra-passe", "password", "new-password"),
    "Criar conta", 'Já tens conta? <a href="#/login">Iniciar sessão</a>');
  form.onsubmit = async (e) => {
    e.preventDefault();
    const err = $("#form-error"), pw = $("#password").value, user = $("#username").value.trim();
    if (!/^[a-zA-Z0-9._]{3,20}$/.test(user)) return (err.textContent = "Utilizador: 3–20 caracteres (letras, números, . e _).");
    if (pw.length < 6) return (err.textContent = "A palavra-passe precisa de pelo menos 6 caracteres.");
    if (pw !== $("#confirm").value) return (err.textContent = "As palavras-passe não coincidem.");

    b.onclick = async () => { b.disabled = true; await safe(a.fn); b.disabled = false; };

/* ---- Chat genérico (conversas e canais): carrega, mostra, envia e atualiza em tempo real ---- */
let chatChannel = null;
function stopChat() { if (chatChannel) { sb.removeChannel(chatChannel); chatChannel = null; } }

/* Texto com links clicáveis (só http/https; o resto entra como texto seguro) */
function setLinked(el, text) {
  el.textContent = "";
  text.split(/(https?:\/\/\S+)/g).forEach((part, i) => {
    if (i % 2) { const a = document.createElement("a"); a.href = part; a.textContent = part; a.className = "lnk"; el.append(a); } else el.append(part);
  });
}

async function chatPanel(host, { table, col, id, myId, nameOf, fetchFn, sendFn }) {
  host.innerHTML = '<div class="msgs"></div><form class="chat-form"><input class="input" maxlength="1000" placeholder="Escreve uma mensagem…" autocomplete="off"><button class="btn btn-primary">Enviar</button></form>';
  const box = $(".msgs", host), seen = new Set();
  const add = (m) => {
    if (seen.has(m.id)) return; seen.add(m.id);
    const mine = m.sender_id === myId, el = html('<div class="msg"><small></small><span></span></div>');
    if (mine) el.classList.add("me");
    if (mine || !nameOf) $("small", el).remove(); else $("small", el).textContent = nameOf(m.sender_id);
    setLinked($("span", el), m.content); box.append(el); box.scrollTop = box.scrollHeight;
  };
  const sync = async () => ((await safe(fetchFn)) || []).forEach(add);
  await sync();
  chatChannel = sb.channel(`${table}-${id}`).on("postgres_changes", { event: "INSERT", schema: "public", table, filter: `${col}=eq.${id}` }, (pl) => add(pl.new)).subscribe();
  $("form", host).onsubmit = async (e) => {
    e.preventDefault();
    const inp = $("input", host), text = inp.value.trim(); if (!text) return;
    inp.value = ""; await safe(() => sendFn(text)); setTimeout(sync, 700);   // plano B se o tempo real falhar
  };
}

const PERMS = [["manage_community", "Gerir comunidade e cargos"], ["manage_channels", "Gerir canais"], ["manage_members", "Gerir membros"], ["invite_members", "Convidar pessoas"]];
/* O dono tem todas as permissões; os outros têm as do seu cargo */
function myPerms(c, myId) {
  if (c.created_by === myId) return Object.fromEntries(PERMS.map(([k]) => [k, true]));
  const m = c.community_members.find((x) => x.user_id === myId), r = c.community_roles.find((x) => x.id === (m || {}).role_id);
  return Object.fromEntries(PERMS.map(([k]) => [k, !!(r && r[k])]));
}

      addActions(r, [
        { label: "Renomear", fn: async () => { const n = prompt("Novo nome do canal:", x.name); if (n && n.trim()) { await api.renameChannel(x.id, n.trim().toLowerCase().replace(/\s+/g, "-")); reload(); } } },
        { label: "Apagar", fn: async () => { if (chans.length < 2) return toast("É preciso pelo menos um canal."); if (confirm(`Apagar #${x.name} e as suas mensagens?`)) { await api.deleteChannel(x.id); reload(); } } }]);
      k.append(r); });
    k.append(html('<div class="add-row"><input class="input" id="new-ch" maxlength="30" placeholder="novo-canal"><button class="btn btn-primary" id="add-ch">Criar canal</button></div>'));
    $("#add-ch").onclick = async () => { const n = $("#new-ch").value.trim().toLowerCase().replace(/\s+/g, "-"); if (!n) return; await safe(() => api.addChannel(c.id, n)); reload(); };
  }

  if (P.manage_community) {
    const k = card("Cargos");
    roles.forEach((r) => {
      const el = html('<div class="role"><div class="role-top"><input type="color" class="rc"><input class="input rn" maxlength="24"></div><div class="perm-grid"></div><div class="row-actions"></div></div>');
      $(".rc", el).value = r.color || "#8b7bff"; $(".rn", el).value = r.name;
      PERMS.forEach(([key, label]) => { const l = html(`<label class="check"><input type="checkbox" data-k="${key}"><span></span></label>`); $("span", l).textContent = label; $("input", l).checked = !!r[key]; $(".perm-grid", el).append(l); });
      addActions(el, [{ label: "Guardar", primary: true, fn: async () => {
        const f = { name: $(".rn", el).value.trim() || r.name, color: $(".rc", el).value }; el.querySelectorAll("[data-k]").forEach((i) => (f[i.dataset.k] = i.checked));
        await api.updateRole(r.id, f); toast("Cargo guardado"); } }, ...(r.is_default ? [] : [{ label: "Apagar", fn: async () => { if (confirm(`Apagar o cargo "${r.name}"?`)) { await api.deleteRole(r.id); reload(); } } }])]);
      k.append(el);
    });
    const nb = html('<button class="btn btn-primary" style="margin-top:6px">+ Novo cargo</button>'); nb.onclick = async () => { await safe(() => api.addRole(c.id)); reload(); }; k.append(nb);
  }

  if (P.manage_members) {
    const k = card("Membros");
    for (const m of await api.communityMembers(c.id)) {
      const p = m.profiles, el = listRow(p, "@" + p.username, "#/u/" + p.username);
      if (p.id === c.created_by) { $(".row-actions", el).append(html('<span class="muted">Dono</span>')); }
      else {
        const sel = html('<select class="input sel"><option value="">Sem cargo</option></select>');
        roles.forEach((r) => { const o = html("<option></option>"); o.value = r.id; o.textContent = r.name; sel.append(o); });
        sel.value = m.role_id || ""; sel.onchange = () => safe(() => api.setMemberRole(c.id, p.id, sel.value ? Number(sel.value) : null));
        $(".row-actions", el).append(sel);
        if (p.id !== me.id) addActions(el, [{ label: "Expulsar", fn: async () => { if (confirm(`Expulsar ${p.username}?`)) { await api.leaveCommunity(c.id, p.id); reload(); } } }]);
      }
      k.append(el);
    }
  }
}

/* ---- Definições da conta: notificações, microfone e apagar conta ---- */
async function viewDefinicoes() {
  const me = await api.me(), prof = await api.profile(me.id);
  mountPage("perfil", `<main class="page"><div class="ptitle-row"><h2 class="ptitle">Definições</h2><a class="btn" href="#/perfil">← Perfil</a></div>
    <div class="card"><h3>Notificações de mensagens</h3><p class="muted" id="n-state"></p><button class="btn btn-primary" id="n-btn">Ativar notificações</button></div>
    <div class="card"><h3>Microfone (chamadas)</h3><p class="muted" id="m-state"></p><button class="btn btn-primary" id="m-btn">Testar microfone</button></div>
    <div class="card"><h3>Zona de perigo</h3><p class="muted">Apagar a conta remove para sempre o teu perfil, publicações, mensagens e as comunidades que criaste.</p><button class="btn btn-danger" id="del-btn">Apagar a minha conta</button></div></main>`, false);
  const nState = () => {
    const p = "Notification" in window ? Notification.permission : "unsupported";
    $("#n-state").textContent = { granted: "Ativas ✓ Aparecem quando o InLog está noutro separador.", denied: "Bloqueadas. Permite-as nas definições do site no navegador.", default: "Ainda não ativadas.", unsupported: "Este navegador não suporta notificações." }[p];
    $("#n-btn").classList.toggle("hidden", p !== "default");
  };
  nState(); $("#n-btn").onclick = async () => { await Notification.requestPermission(); nState(); };
  const mState = async () => {
    try { const r = await navigator.permissions.query({ name: "microphone" }); $("#m-state").textContent = { granted: "Permitido ✓", denied: "Bloqueado. Permite-o nas definições do site no navegador.", prompt: "Ainda não permitido." }[r.state]; }
    catch { $("#m-state").textContent = "Toca em Testar para pedir a permissão."; }
  };
  mState();
  $("#m-btn").onclick = async () => {
    try { (await navigator.mediaDevices.getUserMedia({ audio: true })).getTracks().forEach((t) => t.stop()); toast("Microfone a funcionar ✓"); } catch { toast("Microfone bloqueado ou indisponível."); }
    mState();
  };
  $("#del-btn").onclick = () => { $("#d-confirm").value = ""; $("#delete-dialog").showModal(); };
  $("#delete-dialog form").onsubmit = async (e) => {
    if (e.submitter?.value !== "ok") return;
    if ($("#d-confirm").value.trim() !== prof.username) { e.preventDefault(); return toast("O nome de utilizador não coincide."); }
    const ok = await safe(async () => { await api.deleteAccount(me.id); return true; });
    if (ok) { stopListeners(); try { await sb.auth.signOut(); } catch {} toast("Conta apagada."); location.hash = "#/login"; }
  };
}

/* ---------- Notificações e chamadas de voz (WebRTC, 1 para 1) ----------
   O sinal para tocar/atender passa pelo Realtime do Supabase; o áudio vai
   diretamente entre os dois navegadores. Usa só servidores STUN públicos. */
let liveChannel = null, onLive = null, liveTimer = null;
const pokeLive = (table) => { clearTimeout(liveTimer); liveTimer = setTimeout(() => onLive && onLive(table), 500); };   // evita recarregar em rajada
let ME = null, msgChannel = null, myCallChannel = null, call = null, incoming = null, callTick = null;
const ICE = { iceServers: [{ urls: ["stun:stun.l.google.com:19302", "stun:stun1.l.google.com:19302"] }, ...TURN_SERVERS], iceCandidatePoolSize: 2 };

function systemNotify(title, body, hash, icon) {
  if (!("Notification" in window) || Notification.permission !== "granted" || !document.hidden) return;
  const n = new Notification(title, { body, icon: icon || undefined, tag: hash });
  n.onclick = () => { window.focus(); location.hash = hash; n.close(); };
}

function startListeners(myId) {
  if (!msgChannel) msgChannel = sb.channel("inbox").on("postgres_changes", { event: "INSERT", schema: "public", table: "messages" }, async ({ new: m }) => {
    if (m.sender_id === myId) return;
    if (location.hash === "#/chat/" + m.conversation_id && !document.hidden) return;   // já estás a ver esta conversa
    const p = await safe(() => api.profile(m.sender_id)), name = (p && (p.display_name || p.username)) || "Nova mensagem";
    toast(`${name}: ${m.content.slice(0, 60)}`); systemNotify(name, m.content, "#/chat/" + m.conversation_id, p && p.avatar_url);
  }).subscribe();
  // Tempo real: o que os outros fazem (publicar, apagar, gostos, mudar de foto) aparece sem recarregar
  if (!liveChannel) liveChannel = sb.channel("live")
    .on("postgres_changes", { event: "*", schema: "public", table: "posts" }, (pl) => { if (!(pl.new && pl.new.user_id === myId)) pokeLive("posts"); })
    .on("postgres_changes", { event: "*", schema: "public", table: "likes" }, (pl) => { if (!(pl.new && pl.new.user_id === myId)) pokeLive("likes"); })
    .on("postgres_changes", { event: "UPDATE", schema: "public", table: "profiles" }, (pl) => { if (pl.new.id !== myId) pokeLive("profiles"); })
    .on("postgres_changes", { event: "UPDATE", schema: "public", table: "communities" }, () => pokeLive("communities"))
    .subscribe();
  if (!myCallChannel) myCallChannel = sb.channel("calls:" + myId).on("broadcast", { event: "signal" }, ({ payload }) => onSignal(payload, myId)).subscribe();
}
function stopListeners() {
  for (const ch of [msgChannel, myCallChannel, liveChannel]) if (ch) sb.removeChannel(ch);
  msgChannel = myCallChannel = liveChannel = null; onLive = null; ME = null; if (call) endCall(false);
}

const openOut = (peerId) => new Promise((res) => { const ch = sb.channel("calls:" + peerId); ch.subscribe((st) => st === "SUBSCRIBED" && res(ch)); });
const sig = (payload) => call && call.out.send({ type: "broadcast", event: "signal", payload: { ...payload, from: call.me } });
const getMic = async () => {
  try { return await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } }); }
  catch (e) { toast(e.name === "NotFoundError" ? "Nenhum microfone encontrado." : "Sem acesso ao microfone. Permite-o nas definições do site."); return null; }
};
/* Se o áudio não ligar em 20 s, avisa em vez de ficar calado */
function failIfNotConnected() {
  if (!call) return; clearTimeout(call.timeout);
  call.timeout = setTimeout(() => { if (call && call.state !== "live") { toast("Não foi possível ligar o áudio. A rede pode precisar de um servidor TURN."); endCall(true); } }, 20000);
}

/* Reproduz o áudio remoto; se o browser bloquear o autoplay (comum no Chrome
   Android quando o play() só corre depois de um "await"), mostra aviso com
   botão para destravar com um toque, em vez de ficar em silêncio sem avisar. */
function playRemoteAudio() {
  const a = $("#remote-audio");
  const p = a.play();
  if (p && p.catch) p.catch(() => showUnmuteHint());
}
function showUnmuteHint() {
  if ($("#unmute-hint")) return;
  const b = html('<button class="btn btn-primary" id="unmute-hint" style="position:fixed;left:50%;bottom:70px;transform:translateX(-50%);z-index:60">🔊 Toca para ativar o som</button>');
  b.onclick = () => { playRemoteAudio(); b.remove(); };
  document.body.append(b);
}
/* "Destrava" o elemento de áudio dentro do próprio clique do utilizador
   (gesto síncrono), para que um play() programático mais tarde (quando o
   áudio remoto chegar via WebRTC) já seja permitido pelo browser. */
function unlockRemoteAudio() {
  const a = $("#remote-audio");
  const p = a.play();
  if (p && p.catch) p.catch(() => {});
}

function setupPC() {
  const pc = (call.pc = new RTCPeerConnection(ICE));
  call.stream.getTracks().forEach((t) => pc.addTrack(t, call.stream));
  pc.onicecandidate = (e) => e.candidate && sig({ type: "ice", candidate: e.candidate });
  pc.ontrack = (e) => {   // áudio recebido → altifalante
    const a = $("#remote-audio"); a.srcObject = e.streams[0] || new MediaStream([e.track]); a.muted = false; a.volume = 1;
    playRemoteAudio();
  };
  pc.onconnectionstatechange = () => {
    if (!call) return;
    if (pc.connectionState === "connected") { call.state = "live"; call.t0 = Date.now(); clearTimeout(call.timeout); showCallUI(); }
    if (pc.connectionState === "failed") { toast("A ligação falhou. A rede pode precisar de um servidor TURN."); endCall(true); }
  };
}

async function startCall(peer, myId) {
  if (call || incoming) return toast("Já estás numa chamada.");
  unlockRemoteAudio();
  const stream = await getMic(); if (!stream) return;
  call = { me: myId, peer, stream, state: "calling", pending: [] };
  call.out = await openOut(peer.id); setupPC();
  const offer = await call.pc.createOffer(); await call.pc.setLocalDescription(offer);
  sig({ type: "offer", sdp: offer, name: (ME && (ME.display_name || ME.username)) || "Alguém" });
  showCallUI(); call.timeout = setTimeout(() => { if (call && call.state === "calling") { toast("Sem resposta."); endCall(true); } }, 35000);
}

async function acceptCall() {
  unlockRemoteAudio();
  const inc = incoming, stream = await getMic();
  if (!stream) return declineCall();
  incoming = null; $("#incoming").classList.add("hidden");
  call = { me: ME.id, peer: { id: inc.from, name: inc.name }, stream, state: "connecting", pending: [] };
  call.out = await openOut(inc.from); setupPC();
  await call.pc.setRemoteDescription(inc.sdp);
  for (const c of inc.ice) await call.pc.addIceCandidate(c);
  const ans = await call.pc.createAnswer(); await call.pc.setLocalDescription(ans);
  sig({ type: "answer", sdp: ans }); showCallUI(); failIfNotConnected();
}
async function declineCall() {
  const inc = incoming; incoming = null; $("#incoming").classList.add("hidden"); if (!inc) return;
  const ch = await openOut(inc.from); ch.send({ type: "broadcast", event: "signal", payload: { type: "decline", from: ME.id } }); setTimeout(() => sb.removeChannel(ch), 1000);
}
function endCall(notify) {
  if (!call) return;
  if (notify) sig({ type: "hangup" });
  clearTimeout(call.timeout); clearInterval(callTick);
  call.stream.getTracks().forEach((t) => t.stop()); if (call.pc) call.pc.close();
  const out = call.out; setTimeout(() => sb.removeChannel(out), 1000);
  call = null; $("#remote-audio").srcObject = null; $("#call-ui").classList.add("hidden");
  $("#unmute-hint")?.remove();
}
function showCallUI() {
  if (!call) return; $("#call-ui").classList.remove("hidden");
  const paint = () => { if (!call) return; const s = call.t0 ? Math.floor((Date.now() - call.t0) / 1000) : 0;
    $("#call-text").textContent = call.state === "live" ? `📞 ${call.peer.name} · ${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}` : call.state === "calling" ? `A chamar ${call.peer.name}…` : `A ligar o áudio com ${call.peer.name}…`; };
  paint(); clearInterval(callTick); callTick = setInterval(paint, 1000);
}

async function onSignal(m, myId) {
  if (m.type === "offer") {
    const fr = await api.friendship(myId, m.from);
    if (!fr || fr.status !== "accepted") return;   // só amigos podem ligar
    if (call || incoming) { const ch = await openOut(m.from); ch.send({ type: "broadcast", event: "signal", payload: { type: "decline", from: myId } }); return setTimeout(() => sb.removeChannel(ch), 1000); }
    incoming = { from: m.from, name: m.name, sdp: m.sdp, ice: [] };
    $("#inc-text").textContent = `📞 ${m.name} está a ligar…`; $("#incoming").classList.remove("hidden");
    systemNotify("Chamada de " + m.name, "Toca para atender", "#/mensagens");
    const mark = incoming; setTimeout(() => { if (incoming === mark) { incoming = null; $("#incoming").classList.add("hidden"); toast("Chamada perdida de " + m.name); } }, 35000);
  } else if (m.type === "ice") {
    if (call && call.peer.id === m.from) { if (call.pc.remoteDescription) call.pc.addIceCandidate(m.candidate).catch(() => {}); else call.pending.push(m.candidate); }
    else if (incoming && incoming.from === m.from) incoming.ice.push(m.candidate);
  } else if (m.type === "answer" && call && call.peer.id === m.from) {
    call.state = "connecting"; failIfNotConnected(); showCallUI();
    await call.pc.setRemoteDescription(m.sdp); for (const c of call.pending) await call.pc.addIceCandidate(c).catch(() => {}); call.pending = [];
  } else if (m.type === "hangup" || m.type === "decline") {
    if (incoming && incoming.from === m.from) { incoming = null; $("#incoming").classList.add("hidden"); toast("Chamada perdida"); }
    else if (call && call.peer.id === m.from) { toast(m.type === "decline" ? "Chamada recusada." : "Chamada terminada."); endCall(false); }
  }
}
(function wireCalls() {
  $("#call-end").onclick = () => endCall(true); $("#inc-yes").onclick = acceptCall; $("#inc-no").onclick = declineCall;
  $("#call-mute").onclick = () => { const t = call && call.stream.getAudioTracks()[0]; if (t) { t.enabled = !t.enabled; $("#call-mute").textContent = t.enabled ? "🎤" : "🔇"; } };
})();

/* ---------- 6. ROUTER E ARRANQUE ----------
   Rotas com # (ex.: #/u/maria) porque o GitHub Pages só serve ficheiros estáticos. */
const routes = { "/": viewFeed, "/login": viewLogin, "/registo": viewRegisto, "/perfil": viewPerfil, "/amigos": viewAmigos, "/mensagens": viewMensagens,
  "/chat": viewChat, "/comunidades": viewComunidades, "/c": viewComunidade, "/u": viewUser,
  "/cfg": viewCfg, "/convite": viewConvite, "/definicoes": viewDefinicoes };
const PUBLIC = ["/login", "/registo"];

/* Mostra instruções se o Supabase ainda não estiver configurado */
function viewSetup() {
  document.body.classList.add("auth-mode");
  $("#app").innerHTML = `<main class="card auth-card"><a href="#/" class="logo">${LOGO}<span>InLog</span></a>
    <h1>Falta ligar o Supabase</h1>
    <p class="sub muted">Abre o <b>index.html</b> e preenche <b>SUPABASE_URL</b> e <b>SUPABASE_ANON_KEY</b> no início do script.</p></main>`;
}

async function router() {
  if (!CONFIGURED) return viewSetup();
  stopChat();
  const path = location.hash.slice(1) || "/";
  const [, root = "", arg = ""] = path.match(/^\/([^/]*)(?:\/(.+))?$/) || [];
  const key = "/" + root, user = await api.me(), isPublic = PUBLIC.includes(key);
  if (!user) {
    stopListeners();
    if (key === "/convite") localStorage.setItem("inlog_invite", arg);   // lembra o convite até a pessoa entrar
    if (!isPublic) return (location.hash = "#/login");   // exige sessão
  }
  if (user && isPublic) return (location.hash = "#/");
  const pend = user && localStorage.getItem("inlog_invite");
  if (pend) { localStorage.removeItem("inlog_invite"); return (location.hash = "#/convite/" + pend); }
  if (user) { if (!ME) ME = await safe(() => api.profile(user.id)); startListeners(user.id); }
  composerCommunity = null; onLive = null; window.scrollTo(0, 0);
  await safe(() => (routes[key] || viewFeed)(decodeURIComponent(arg)));
}
window.addEventListener("hashchange", router);
if (CONFIGURED) sb.auth.onAuthStateChange((ev) => { if (ev === "SIGNED_OUT") router(); });
router();
</script>
